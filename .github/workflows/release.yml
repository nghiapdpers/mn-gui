name: Release Compiled Assets

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cài đặt dependencies
        run: npm ci

      - name: Biên dịch thư viện (Build)
        run: npm run build

      - name: Deploy lên nhánh release
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Lưu lại các tệp build
          mkdir -p ../temp_build
          cp -r mngui.js mngui.min.js dist/ ../temp_build/
          
          # Lấy danh sách tất cả các nhánh từ remote
          git fetch origin
          
          # Kiểm tra và chuyển sang nhánh release
          if git show-ref --verify --quiet refs/remotes/origin/release; then
            git checkout release
            git pull origin release
          else
            git checkout -b release
          fi
          
          # Sao chép ngược lại các tệp build vào nhánh release
          cp -r ../temp_build/* .
          
          # Thêm và commit thay đổi
          git add mngui.js mngui.min.js dist/
          git commit -m "chore: release assets [skip ci]" || echo "Không có thay đổi để commit"
          
          # Push sang nhánh release
          git push origin release
