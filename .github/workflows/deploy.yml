name: Deploy to GitHub Pages

on:
  push:
    branches:
      - release
      - main
      - master
  workflow_dispatch:

# Cấp quyền ghi cần thiết để xuất bản GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Đảm bảo chỉ có một bản deploy chạy tại một thời điểm
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập môi trường GitHub Pages
        uses: actions/configure-pages@v4

      - name: Tải lên Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Tải lên toàn bộ thư mục gốc chứa index.html, mngui.js và mngui.min.js
          path: '.'

      - name: Triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
